name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Menos do que o padrao do repositorio: nenhum job aqui escreve nada.
permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  verify:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Acoes fixadas por hash: uma tag pode ser movida para outro commit, e
      # quem move a tag passa a rodar codigo dentro deste pipeline.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Sem scripts de instalacao: dependencia comprometida nao executa nada
      # aqui. Nenhuma das nossas precisa deles (@firebase/util ja traz o arquivo
      # que o script geraria; protobufjs so confere versao; unrs-resolver usa o
      # binario opcional que o npm ja instala).
      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Instalar dependencias do backend
        run: npm ci --ignore-scripts --prefix functions

      # Antes de qualquer outra coisa: segredo que entrou no commit tem de
      # parar aqui, nao depois do build.
      - name: Varredura de segredos
        run: npm run scan:secrets

      - name: Conferir radar do projeto
        run: node scripts/build-project-dashboard.mjs --check

      - name: Lint
        run: npm run lint

      - name: Checagem de tipos
        run: npm run type-check

      - name: Testes
        run: npm run test

      # Vulnerabilidade alta ou critica em dependencia de producao quebra o
      # pipeline. As moderadas aparecem no relatorio sem travar.
      - name: Auditoria das dependencias
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --omit=dev --audit-level=high --prefix functions

      # As variaveis NEXT_PUBLIC_* sao identificadores publicos do projeto
      # Firebase, nao credenciais. Quando ausentes, o build sai em modo
      # demonstracao — por isso o pipeline funciona em um fork sem segredos.
      - name: Build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_APP_CHECK_SITE_KEY: ${{ secrets.NEXT_PUBLIC_APP_CHECK_SITE_KEY }}
        run: npm run build

      - name: Guardar o build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-export
          path: out/
          retention-days: 7

  # As suites de regras, storage, repositorio e acesso so rodam contra os
  # emuladores. Fora do CI elas ficaram semanas quebradas sem ninguem ver
  # (data fixa de cobranca que venceu), por isso rodam em todo push e PR.
  # Projeto `demo-*`: o emulador recusa qualquer chamada a servico real, e
  # nenhum segredo entra neste job.
  emulator:
    name: Emuladores - regras, storage, repositorio e acesso
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      # Versao exata: a CLI decide quais binarios de emulador baixa, e uma
      # versao nova do emulador muda o comportamento das regras sem commit.
      FIREBASE_TOOLS_VERSION: "15.29.0"
      RULES_UNIT_TESTING_VERSION: "5.0.2"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Firestore, Storage e Cloud Tasks emulados sao processos Java.
      - name: Configurar Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Instalar dependencias do backend
        run: npm ci --ignore-scripts --prefix functions

      # Os scripts de teste procuram a CLI em `.local/firebase-tools`, o mesmo
      # lugar da maquina de desenvolvimento, fora do package.json da raiz para
      # nao levar a CLI ao build. Sem scripts de instalacao, como acima: o
      # unico que faria falta e o `re2` nativo, usado so pelo Hosting.
      - name: Instalar a CLI do Firebase
        run: >-
          npm install --prefix .local/firebase-tools --ignore-scripts
          --no-audit --no-fund --save-exact
          firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }}
          @firebase/rules-unit-testing@${{ env.RULES_UNIT_TESTING_VERSION }}

      # Os binarios dos emuladores vem de fora do npm; guardar evita baixar a
      # cada execucao. A chave segue a versao da CLI, que fixa a deles.
      - name: Cache dos emuladores
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ env.FIREBASE_TOOLS_VERSION }}

      - name: Testes nos emuladores
        run: npm run test:emulator

  codeql:
    name: Analise estatica de seguranca
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar CodeQL
        uses: github/codeql-action/init@977e6ceaea7361825998245d787fa3b4d6b9e5df # codeql-bundle-v2.27.0
        with:
          languages: javascript-typescript

      # Projeto em TypeScript e JavaScript: o CodeQL le o codigo sem precisar
      # compilar.
      - name: Analisar
        uses: github/codeql-action/analyze@977e6ceaea7361825998245d787fa3b4d6b9e5df # codeql-bundle-v2.27.0
