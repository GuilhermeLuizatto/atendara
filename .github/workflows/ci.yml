name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Menos do que o padrao do repositorio: nenhum job aqui escreve nada.
permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  verify:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Acoes fixadas por hash: uma tag pode ser movida para outro commit, e
      # quem move a tag passa a rodar codigo dentro deste pipeline.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar dependencias do backend
        run: npm ci --prefix functions

      # Antes de qualquer outra coisa: segredo que entrou no commit tem de
      # parar aqui, nao depois do build.
      - name: Varredura de segredos
        run: npm run scan:secrets

      - name: Lint
        run: npm run lint

      - name: Checagem de tipos
        run: npm run type-check

      - name: Testes
        run: npm run test

      # Vulnerabilidade alta ou critica em dependencia de producao quebra o
      # pipeline. As moderadas aparecem no relatorio sem travar.
      - name: Auditoria das dependencias
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --omit=dev --audit-level=high --prefix functions

      # As variaveis NEXT_PUBLIC_* sao identificadores publicos do projeto
      # Firebase, nao credenciais. Quando ausentes, o build sai em modo
      # demonstracao — por isso o pipeline funciona em um fork sem segredos.
      - name: Build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_APP_CHECK_SITE_KEY: ${{ secrets.NEXT_PUBLIC_APP_CHECK_SITE_KEY }}
        run: npm run build

      - name: Guardar o build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: static-export
          path: out/
          retention-days: 7

  codeql:
    name: Analise estatica de seguranca
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar CodeQL
        uses: github/codeql-action/init@977e6ceaea7361825998245d787fa3b4d6b9e5df # codeql-bundle-v2.27.0
        with:
          languages: javascript-typescript

      # Projeto em TypeScript e JavaScript: o CodeQL le o codigo sem precisar
      # compilar.
      - name: Analisar
        uses: github/codeql-action/analyze@977e6ceaea7361825998245d787fa3b4d6b9e5df # codeql-bundle-v2.27.0
