# SonarQube Cloud. Chaves da organizacao e do projeto como o SonarQube Cloud
# as cria ao importar o repositorio do GitHub; trocar aqui se forem outras.
sonar.organization=guilhermeluizatto
sonar.projectKey=GuilhermeLuizatto_atendara
sonar.projectName=Atendara

sonar.sourceEncoding=UTF-8
sonar.sources=src,functions,scripts
sonar.tests=src,functions,scripts
sonar.test.inclusions=**/*.test.ts,**/*.test.js,**/*.test.mjs,**/*.emulator-test.ts,**/*.emulator-test.js,**/*.access-test.ts
# Os gerados sao copia transpilada de src/: analisa-los duplicaria cada achado.
# Testes saem das fontes porque ja entram em sonar.tests.
sonar.exclusions=functions/generated/**,functions/node_modules/**,functions/fixtures/**,src/mocks/**,**/*.test.ts,**/*.test.js,**/*.test.mjs,**/*.emulator-test.ts,**/*.emulator-test.js,**/*.access-test.ts
sonar.cpd.exclusions=functions/generated/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# node_modules do backend tem arquivos *.test.js de terceiros.
sonar.test.exclusions=functions/node_modules/**
