version: 2

# Atualizacao de dependencia e de acao vira pull request, nao tarefa de
# memoria. O limite baixo e proposital: uma pilha de PRs abertos vira ruido e
# ninguem revisa.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Atualizacao de rotina junta num PR so; o que muda versao maior vem
      # separado, porque exige leitura.
      minor-e-correcao:
        update-types: ["minor", "patch"]

    # Testado em 16/09/2026: os dois quebram por causa de terceiros, nao nosso.
    # O eslint-config-next traz um plugin do React que nao roda no ESLint 10, e
    # o typescript-eslint ainda recusa o TypeScript 7. Voltam quando essas duas
    # pecas acompanharem.
    ignore:
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/functions"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-e-correcao:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
