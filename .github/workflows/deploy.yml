name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

# `id-token: write` e o que permite ao job pedir o token OIDC do GitHub, que a
# federacao troca por um acesso curto no Google Cloud. E o que substitui a
# chave de conta de servico que nunca expirava.
permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: "22"
  # Versao fixa: `@latest` significa rodar, com credencial de publicacao, a
  # versao que a internet publicou hoje de manha.
  FIREBASE_TOOLS_VERSION: "15.30.1"

jobs:
  deploy:
    name: Firebase Hosting e Security Rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # O contexto `secrets` nao existe no `if` de um job, entao a verificacao
      # vira uma saida de step. Sem a federacao configurada o workflow termina
      # com sucesso e apenas informa que o deploy foi pulado — util em forks.
      - name: Verificar credenciais
        id: guard
        env:
          PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ -n "$PROVIDER" ] && [ -n "$SERVICE_ACCOUNT" ] && [ -n "$PROJECT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy pulado: configure GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT e FIREBASE_PROJECT_ID."
          fi

      # Sem a configuracao publica do Firebase o build sai em modo
      # DEMONSTRACAO — e publicar isso por cima da producao seria pior do que
      # nao publicar. Aqui o deploy falha alto, em vez de seguir em silencio.
      - name: Exigir a configuracao publica do Firebase
        if: steps.guard.outputs.ready == 'true'
        env:
          API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          APP_CHECK: ${{ secrets.NEXT_PUBLIC_APP_CHECK_SITE_KEY }}
        run: |
          faltando=""
          [ -z "$API_KEY" ] && faltando="$faltando NEXT_PUBLIC_FIREBASE_API_KEY"
          [ -z "$AUTH_DOMAIN" ] && faltando="$faltando NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN"
          [ -z "$PROJECT_ID" ] && faltando="$faltando NEXT_PUBLIC_FIREBASE_PROJECT_ID"
          [ -z "$APP_ID" ] && faltando="$faltando NEXT_PUBLIC_FIREBASE_APP_ID"
          [ -z "$APP_CHECK" ] && faltando="$faltando NEXT_PUBLIC_APP_CHECK_SITE_KEY"
          if [ -n "$faltando" ]; then
            echo "::error::Faltam segredos da configuracao publica:$faltando. Sem eles o build sai em modo demonstracao e NAO pode ir ao ar."
            exit 1
          fi

      - name: Configurar Node
        if: steps.guard.outputs.ready == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias
        if: steps.guard.outputs.ready == 'true'
        run: npm ci

      - name: Instalar dependencias do backend
        if: steps.guard.outputs.ready == 'true'
        run: npm ci --prefix functions

      - name: Verificacao completa
        if: steps.guard.outputs.ready == 'true'
        run: npm run scan:secrets && npm run lint && npm run type-check && npm run test

      - name: Build
        if: steps.guard.outputs.ready == 'true'
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_APP_CHECK_SITE_KEY: ${{ secrets.NEXT_PUBLIC_APP_CHECK_SITE_KEY }}
          # Embedded Signup da Meta. Ao contrario da configuracao do Firebase,
          # estes NAO sao exigidos: vazios, `isMetaEmbeddedSignupConfigured()`
          # devolve falso e a tela de WhatsApp diz o que falta, em vez de
          # quebrar. Exigir aqui travaria todo deploy ate a Meta estar pronta.
          NEXT_PUBLIC_META_APP_ID: ${{ secrets.NEXT_PUBLIC_META_APP_ID }}
          NEXT_PUBLIC_META_EMBEDDED_SIGNUP_CONFIG_ID: ${{ secrets.NEXT_PUBLIC_META_EMBEDDED_SIGNUP_CONFIG_ID }}
        run: npm run build

      # Ultima linha de defesa antes de publicar: recusa bundle com verificador
      # de demonstracao ou com segredo dentro.
      - name: Conferir o bundle publicado
        if: steps.guard.outputs.ready == 'true'
        run: npm run check:bundle

      # Nenhuma chave e gravada em disco por nos: a acao cria um arquivo de
      # credencial de curta duracao e o apaga no fim do job.
      - name: Autenticar no Google Cloud
        if: steps.guard.outputs.ready == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      # As Security Rules vao antes do Hosting: se as regras falharem, a versao
      # nova do frontend nao entra no ar com o banco ainda desprotegido.
      - name: Publicar Security Rules e indices
        if: steps.guard.outputs.ready == 'true'
        run: |
          npx --yes firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }} deploy \
            --only firestore:rules,firestore:indexes \
            --project "${{ secrets.FIREBASE_PROJECT_ID }}" \
            --non-interactive

      - name: Publicar no Firebase Hosting
        if: steps.guard.outputs.ready == 'true'
        run: |
          npx --yes firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }} deploy \
            --only hosting \
            --project "${{ secrets.FIREBASE_PROJECT_ID }}" \
            --non-interactive
