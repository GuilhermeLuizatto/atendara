# Analise automatica do SonarQube Cloud. Ela le so este arquivo; a analise
# pelo CI usa o sonar-project.properties. Os dois excluem o mesmo.
#
# functions/generated e copia transpilada de src/ para as Functions
# (scripts/build-functions.mjs): analisa-la contaria cada linha duas vezes e
# reprovaria a duplicacao de todo PR que muda politica compartilhada.
sonar.exclusions=functions/generated/**,functions/node_modules/**,src/mocks/**
sonar.cpd.exclusions=functions/generated/**
